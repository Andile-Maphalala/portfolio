server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

        # Hidden files (.env, .git, .htaccess...) except .well-known
    location ~ /\.(?!well-known) {
        return 404;
    }

    # Common scanner paths
    location ~* ^/(wp-|wordpress|xmlrpc|phpmyadmin|pma|cgi-bin|vendor/|admin|administrator|backup|config|actuator|server-status|boaform|shell|console|solr|jenkins) {
        return 404;
    }

    # Real static assets: cached, 404 if missing
    location ~* \.(js|css|woff2?|ttf|svg|png|jpe?g|webp|ico|map)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Any other path with a file extension (.php, .txt, .pot, .asp...) is a 404
    location ~* "\.[a-z0-9]{2,5}$" {        
        try_files $uri =404;
    }

    # Never cache index.html, so users always get the latest build
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Known Angular routes get index.html with a 200
    location = / {
        try_files /index.html =404;
    }

    location = /thank-you {
        try_files /index.html =404;
    }

    # Everything else: a real 404 status, but still show the Angular not-found page
    location / {
        try_files $uri =404;
        error_page 404 /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}