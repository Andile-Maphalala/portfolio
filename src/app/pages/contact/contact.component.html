<section id="contact" class="relative py-24 px-6 border-t border-white/5">
  <div class="max-w-5xl mx-auto fade-section">

    <div class="glass-card rounded-3xl p-8 md:p-12">

      <div class="text-center mb-12">
        <span class="text-cyan-400 font-mono text-sm tracking-[0.2em]">
          /// GET IN TOUCH
        </span>

        <h2 class="font-display text-4xl sm:text-5xl font-bold mt-2">
          Let's build something
          <span class="text-blue-400">great together</span>
        </h2>

        <p class="text-on-surface-muted max-w-2xl mx-auto mt-4">
          Whether you have a project in mind, an opportunity to discuss,
          or simply want to connect, I'd love to hear from you.
        </p>
      </div>

      <div class="grid md:grid-cols-2 gap-10">

        <div>

          <div class="space-y-4">
            <a href="https://github.com/Andile-Maphalala"
              target="_blank"
              class="glass-card p-4 rounded-2xl flex items-center gap-4 hover:border-cyan-400/40 transition-all">

              <span class="material-symbols-outlined text-cyan-400">
                code
              </span>

              <div>
                <div class="text-sm text-on-surface-muted">GitHub</div>
                <div class="font-medium">github.com/Andile-Maphalala</div>
              </div>

            </a>

            <a href="https://www.linkedin.com/in/andile-maphalala-4a12391b2"
              target="_blank"
              class="glass-card p-4 rounded-2xl flex items-center gap-4 hover:border-cyan-400/40 transition-all">

              <span class="material-symbols-outlined text-cyan-400">
                work
              </span>

              <div>
                <div class="text-sm text-on-surface-muted">LinkedIn</div>
                <div class="font-medium">Connect with me</div>
              </div>

            </a>

          </div>
        </div>

        <form action="https://api.web3forms.com/submit" method="POST" class="space-y-4">

          <input type="hidden"
            name="access_key"
            value="ac0d8281-3ec9-42fb-a5ba-93ade590b605">

          <input type="hidden" name="subject" value="Portfolio Contact Form">

          <input
            type="text"
            name="name"
            placeholder="Your Name"
            required
            class="w-full bg-surface border border-white/10 rounded-xl p-4 focus:border-cyan-400 outline-none transition-all">

          <input
            type="email"
            name="email"
            placeholder="Email Address"
            required
            class="w-full bg-surface border border-white/10 rounded-xl p-4 focus:border-cyan-400 outline-none transition-all">

          <textarea
            rows="5"
            name="message"
            placeholder="What is on your mind..."
            required
            class="w-full bg-surface border border-white/10 rounded-xl p-4 focus:border-cyan-400 outline-none transition-all"></textarea>

          <button
            type="submit"
            class="w-full py-4 rounded-xl bg-gradient-to-r from-cyan-400 to-blue-500 text-black font-semibold hover:scale-[1.02] transition-all">

            Send Message

          </button>

        </form>

      </div>

    </div>

  </div>
</section>
