<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Andile Maphalala · Portfolio</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  
  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=JetBrains+Mono:wght@500;700&family=Orbitron:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            surface: "#0b0d15",
            "surface-card": "#11141f",
            "surface-card-hover": "#1a1e2e",
            "on-surface": "#eef2f8",
            "on-surface-muted": "#8892b0",
            primary: "#00d4ff",
            secondary: "#6c8cff",
            accent: "#4a9eff",
            "neon-cyan": "#00d4ff",
            "neon-blue": "#3b82f6",
            "glow-cyan": "rgba(0, 212, 255, 0.25)",
          },
          fontFamily: {
            display: ["Orbitron", "sans-serif"],
            mono: ["JetBrains Mono", "monospace"],
            body: ["Inter", "sans-serif"],
          },
          animation: {
            "glow-pulse": "glowPulse 5s ease-in-out infinite",
            "float": "float 7s ease-in-out infinite",
            "tilt": "tilt 12s linear infinite",
            "scroll-indicator": "bounce 2s infinite",
            "blink-dot": "blinkDot 1.2s ease-in-out infinite",
            "slide-up": "slideUp 0.9s ease-out forwards",
            "slide-up-delay": "slideUp 0.9s ease-out 0.3s forwards",
            "slide-up-delay-2": "slideUp 0.9s ease-out 0.6s forwards",
            "engine-rev": "engineRev 2.8s ease-in-out infinite",
            "drift-skid": "driftSkid 4s ease-in-out infinite",
            "smoke-drift": "smokeDrift 6s ease-in-out infinite",
          },
          keyframes: {
            glowPulse: {
              "0%, 100%": { opacity: 0.2, transform: "scale(1)" },
              "50%": { opacity: 0.5, transform: "scale(1.2)" },
            },
            float: {
              "0%, 100%": { transform: "translateY(-8px)" },
              "50%": { transform: "translateY(14px)" },
            },
            tilt: {
              "0%": { transform: "rotate(0deg) scale(1)" },
              "30%": { transform: "rotate(2deg) scale(1.02)" },
              "70%": { transform: "rotate(-2deg) scale(0.98)" },
              "100%": { transform: "rotate(0deg) scale(1)" },
            },
            blinkDot: {
              "0%, 100%": { opacity: 1 },
              "50%": { opacity: 0.15 },
            },
            slideUp: {
              "0%": { opacity: 0, transform: "translateY(50px)" },
              "100%": { opacity: 1, transform: "translateY(0)" },
            },
            engineRev: {
              "0%, 100%": { transform: "scale(1) rotate(0deg)", filter: "brightness(1)" },
              "25%": { transform: "scale(1.08) rotate(1.5deg)", filter: "brightness(1.4)" },
              "50%": { transform: "scale(0.95) rotate(-1deg)", filter: "brightness(0.9)" },
              "75%": { transform: "scale(1.05) rotate(2deg)", filter: "brightness(1.2)" },
            },
            driftSkid: {
              "0%": { transform: "translateX(0) rotate(0deg)" },
              "25%": { transform: "translateX(25px) rotate(6deg)" },
              "50%": { transform: "translateX(-20px) rotate(-5deg)" },
              "75%": { transform: "translateX(15px) rotate(4deg)" },
              "100%": { transform: "translateX(0) rotate(0deg)" },
            },
            smokeDrift: {
              "0%": { opacity: 0.1, transform: "scale(0.9) translateY(0)" },
              "50%": { opacity: 0.5, transform: "scale(1.3) translateY(-18px)" },
              "100%": { opacity: 0, transform: "scale(1.7) translateY(-40px)" },
            },
          },
          backgroundImage: {
            'hero-gradient': 'radial-gradient(circle at 30% 30%, rgba(0,212,255,0.08) 0%, rgba(11,13,21,0.9) 70%), radial-gradient(circle at 70% 80%, rgba(108,140,255,0.06) 0%, transparent 60%)',
          },
          boxShadow: {
            "glow-cyan": "0 0 35px -10px rgba(0, 212, 255, 0.6)",
            "glow-blue": "0 0 35px -10px rgba(59, 130, 246, 0.5)",
            "card-glow": "0 12px 40px -10px rgba(0, 212, 255, 0.15)",
          },
        },
      },
    };
  </script>
</head>
<body class="bg-surface text-on-surface antialiased">
  <app-root></app-root>
</body>
</html>
